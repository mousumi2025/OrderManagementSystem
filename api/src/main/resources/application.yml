# All connection settings can be overridden with environment variables.
# Never commit real passwords - set DB_PASSWORD in the environment instead.
spring:
  application:
    name: order-management-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/CloudOrderManagementSystems}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    # Schema is owned by ../sql/deploy.sql; Hibernate only checks the mappings match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
